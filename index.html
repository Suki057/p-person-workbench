<style>
  :root{
    --bg:#FAF8F5;
    --pink:#F8E0E6;
    --green:#E0F0E6;
    --yellow:#F8F0E0;
    --pink-mid:#E6B8C4;
    --green-mid:#ADD9BE;
    --yellow-mid:#E6D2A6;
    --text:#4a4a4a;
    --done:#999999;
    --shadow:rgba(0,0,0,0.05) 0px 2px 8px;
    --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Helvetica,"Microsoft YaHei",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    line-height:1.5;
    padding:16px;
    min-height:100vh;
  }
  .app{max-width:1280px;margin:0 auto;}
  h1.title{font-size:16px;font-weight:600;margin-bottom:4px;}
  .subtitle{font-size:13px;color:var(--done);margin-bottom:16px;}

  /* 顶部统计 */
  .stats{
    display:flex;gap:16px;flex-wrap:wrap;align-items:center;
    background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 20px;margin-bottom:16px;
  }
  .ring-wrap{display:flex;align-items:center;gap:10px;}
  .ring{position:relative;width:72px;height:72px;}
  .ring svg{transform:rotate(-90deg);}
  .ring-bg{fill:none;stroke:#eee;stroke-width:7;}
  .ring-fg{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
  .ring-pct{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:600;
  }
  .ring-label{font-size:13px;}
  .ring-label b{display:block;font-size:15px;margin-top:2px;}
  .stats-divider{width:1px;height:48px;background:#eee;}

  /* 三栏布局 */
  .columns{display:flex;gap:16px;align-items:flex-start;}
  .col{flex:1;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
  .col h2{font-size:16px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
  .col h2 .hint{font-size:12px;color:var(--done);font-weight:400;}

  /* 周打卡 */
  .week-head{display:grid;grid-template-columns:80px repeat(7,1fr);gap:6px;margin-bottom:8px;}
  .week-head div{text-align:center;font-size:12px;color:var(--done);}
  .habit-row{display:grid;grid-template-columns:80px repeat(7,1fr);gap:6px;align-items:center;margin-bottom:10px;}
  .habit-name{font-size:14px;display:flex;align-items:center;gap:6px;}
  .habit-name .streak{font-size:11px;color:var(--done);}
  .dot{
    width:30px;height:30px;border-radius:50%;margin:0 auto;cursor:pointer;
    background:#fff;border:1.5px solid #e3e0dc;display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#fff;transition:transform .15s, background .2s;
    user-select:none;
  }
  .dot:active{transform:scale(.85);}
  .dot.done{background:var(--c);border-color:var(--c);}
  .dot.done::after{content:"✓";}
  .add-habit{margin-top:8px;display:flex;gap:6px;}
  .add-habit input{flex:1;border:1px solid #e3e0dc;border-radius:6px;padding:7px 9px;font-size:13px;background:var(--bg);}
  .btn{
    border:none;border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer;
    background:var(--pink);color:#7a5a63;transition:opacity .2s;
  }
  .btn:active{opacity:.7;}
  .btn.green{background:var(--green);color:#4f6f5a;}
  .btn.ghost{background:transparent;color:var(--done);}

  /* 任务清单 */
  .task-add{display:flex;gap:6px;margin-bottom:14px;}
  .task-add input{flex:1;border:1px solid #e3e0dc;border-radius:6px;padding:8px 10px;font-size:14px;background:var(--bg);}
  .task-date-group{margin-bottom:14px;}
  .task-date{font-size:12px;color:var(--done);margin:8px 0 6px;border-left:3px solid var(--green-mid);padding-left:8px;}
  .task-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed #f0ede9;}
  .task-check{
    width:22px;height:22px;border-radius:50%;border:1.5px solid #d8d4cf;flex:0 0 auto;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#fff;transition:background .2s,transform .15s;
  }
  .task-check:active{transform:scale(.85);}
  .task-check.done{background:var(--green-mid);border-color:var(--green-mid);}
  .task-check.done::after{content:"✓";}
  .task-text{flex:1;font-size:14px;transition:color .2s;}
  .task-text.done{color:var(--done);text-decoration:line-through;}
  .task-del{border:none;background:transparent;color:#c9bdbd;font-size:16px;cursor:pointer;padding:2px 6px;}
  .task-del:active{color:#e08a8a;}

  /* 日记 · 翻页笔记本 */
  .book{
    position:relative;height:300px;perspective:1500px;
    background:linear-gradient(135deg,#F3E9DC,#EDE1CF);
    border-radius:var(--radius);margin-bottom:4px;
    box-shadow:inset 0 0 0 1px #e7dccb;
  }
  .book-spine{
    position:absolute;left:0;top:0;bottom:0;width:16px;z-index:3;
    background:linear-gradient(90deg,#d9c7b0,#efe3d2);
    border-radius:var(--radius) 0 0 var(--radius);
    box-shadow:2px 0 6px rgba(0,0,0,0.08);
  }
  .book-spine::before{
    content:"";position:absolute;left:5px;top:14px;bottom:14px;width:2px;
    background:repeating-linear-gradient(#c9b69c 0 6px,transparent 6px 14px);
  }
  .page{
    position:absolute;left:16px;right:4px;top:6px;bottom:6px;
    background:#FFFDF7;border-radius:0 8px 8px 0;
    box-shadow:inset -10px 0 18px rgba(0,0,0,0.05), 3px 4px 10px rgba(0,0,0,0.07);
    transform-origin:left center;backface-visibility:hidden;
    padding:16px;display:flex;flex-direction:column;overflow:hidden;
  }
  .page .d-date{font-size:13px;color:#8a7a5a;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .page .d-date .tag{font-size:11px;background:var(--pink);color:#7a5a63;padding:1px 7px;border-radius:8px;}
  .page .d-img{width:100%;height:118px;object-fit:cover;border-radius:6px;margin-bottom:8px;background:#fff;}
  .page .d-img-ph{width:100%;height:118px;border-radius:6px;margin-bottom:8px;background:#fff;display:flex;align-items:center;justify-content:center;color:#c9bdbd;font-size:12px;}
  .page .d-text{flex:1;font-size:14px;white-space:pre-wrap;word-break:break-word;color:#5a5347;}
  .diary-empty{color:var(--done);font-size:13px;text-align:center;padding:60px 0;}
  .diary-nav{display:flex;align-items:center;justify-content:space-between;margin-top:10px;}
  .diary-nav .month{font-size:13px;color:var(--done);}
  .diary-nav button{border:none;background:var(--pink);color:#7a5a63;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;transition:opacity .2s;}
  .diary-nav button:active{opacity:.6;}
  .diary-nav button:disabled{opacity:.4;}
  .diary-nav button:disabled{opacity:.4;}
  .diary-add{margin-top:12px;}
  .diary-add textarea{
    width:100%;border:1px solid #e3e0dc;border-radius:6px;padding:8px;font-size:13px;resize:vertical;
    min-height:54px;background:var(--bg);font-family:inherit;margin-bottom:6px;
  }
  .diary-add .row{display:flex;gap:6px;align-items:center;}
  .diary-add input[type=file]{font-size:12px;flex:1;}
  .diary-add .btn{background:var(--green);color:#4f6f5a;}

  @media (max-width:900px){
    .columns{flex-direction:column;}
    .col{width:100%;}
    body{padding:10px;}
  }
</style>
</head>

<script>
const PALETTE=[
  {key:'pink',  light:'#F8E0E6', mid:'#E6B8C4'},
  {key:'green', light:'#E0F0E6', mid:'#ADD9BE'},
  {key:'yellow',light:'#F8F0E0', mid:'#E6D2A6'}
];
const DAYS=7;
const STORE_KEY='pperson_workbench_v1';

let state=loadState();
let diaryIndex=0;

function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function monthStr(s){return s.slice(0,7);}
function thisMonth(){return monthStr(todayStr());}

function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem(STORE_KEY));
    if(s&&s.habits) return s;
  }catch(e){}
  return {
    habits:[
      {id:1,name:'喝水',color:0,days:[false,false,false,false,false,false,false]},
      {id:2,name:'阅读',color:1,days:[false,false,false,false,false,false,false]},
      {id:3,name:'运动',color:2,days:[false,false,false,false,false,false,false]},
      {id:4,name:'早睡',color:0,days:[false,false,false,false,false,false,false]},
      {id:5,name:'冥想',color:1,days:[false,false,false,false,false,false,false]}
    ],
    tasks:[],
    diaries:[]
  };
}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));}

/* ---------- 周打卡 ---------- */
function maxStreak(days){
  let best=0,cur=0;
  for(const d of days){if(d){cur++;best=Math.max(best,cur);}else cur=0;}
  return best;
}
function renderHabits(){
  const wrap=document.getElementById('habitList');wrap.innerHTML='';
  state.habits.forEach(h=>{
    const p=PALETTE[h.color%3];
    const row=document.createElement('div');row.className='habit-row';
    const name=document.createElement('div');name.className='habit-name';
    name.innerHTML=`<span>${h.name}</span><span class="streak">连续${maxStreak(h.days)}天</span>`;
    row.appendChild(name);
    h.days.forEach((done,i)=>{
      const dot=document.createElement('div');
      dot.className='dot'+(done?' done':'');
      if(done) dot.style.setProperty('--c',p.mid);
      dot.onclick=()=>{h.days[i]=!h.days[i];save();renderHabits();updateStats();};
      row.appendChild(dot);
    });
    wrap.appendChild(row);
  });
}
function addHabit(){
  const inp=document.getElementById('habitInput');
  const v=inp.value.trim();if(!v)return;
  state.habits.push({id:Date.now(),name:v,color:state.habits.length%3,days:Array(DAYS).fill(false)});
  inp.value='';save();renderHabits();
}

/* ---------- 任务清单 ---------- */
function renderTasks(){
  const wrap=document.getElementById('taskList');wrap.innerHTML='';
  const groups={};
  state.tasks.forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t);});
  const dates=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  if(dates.length===0){wrap.innerHTML='<div class="diary-empty">还没有任务，添加一条开始吧～</div>';return;}
  dates.forEach(date=>{
    const g=document.createElement('div');g.className='task-date-group';
    const head=document.createElement('div');head.className='task-date';
    head.textContent=date===todayStr()?'今天 · '+date:date;
    g.appendChild(head);
    groups[date].forEach(t=>{
      const item=document.createElement('div');item.className='task-item';
      const chk=document.createElement('div');chk.className='task-check'+(t.done?' done':'');
      chk.onclick=()=>{t.done=!t.done;save();renderTasks();updateStats();};
      const txt=document.createElement('div');txt.className='task-text'+(t.done?' done':'');
      txt.textContent=t.text;
      const del=document.createElement('button');del.className='task-del';del.textContent='×';
      del.onclick=()=>{state.tasks=state.tasks.filter(x=>x.id!==t.id);save();renderTasks();updateStats();};
      item.append(chk,txt,del);g.appendChild(item);
    });
    wrap.appendChild(g);
  });
}
function addTask(){
  const inp=document.getElementById('taskInput');
  const v=inp.value.trim();if(!v)return;
  state.tasks.push({id:Date.now(),text:v,date:todayStr(),done:false});
  inp.value='';save();renderTasks();updateStats();
}
document.getElementById('taskInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});

/* ---------- 月度日记 · 翻页笔记本 ---------- */
function diaryMonthList(){
  const list=state.diaries.slice().sort((a,b)=>a.date.localeCompare(b.date)); // 升序：翻页从早到晚
  const ml=list.filter(d=>monthStr(d.date)===thisMonth());
  return ml.length?ml:list;
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function buildDiaryHTML(d){
  const img=d.image?`<img class="d-img" src="${d.image}">`:`<div class="d-img-ph">无图片</div>`;
  return `<div class="d-date">${d.date}<span class="tag">手帐</span></div>${img}<div class="d-text">${escapeHtml(d.text||'（无文字）')}</div>`;
}
function renderDiaryPage(){
  const list=diaryMonthList();
  const page=document.getElementById('diaryPage');
  const mon=document.getElementById('diaryMonth');
  if(list.length===0){
    page.innerHTML='<div class="diary-empty">本月还没有日记<br>在下方写下第一篇吧 🌿</div>';
    mon.textContent=thisMonth();diaryIndex=0;updateDiaryNav();return;
  }
  if(diaryIndex<0)diaryIndex=0;
  if(diaryIndex>=list.length)diaryIndex=list.length-1;
  const d=list[diaryIndex];
  page.innerHTML=buildDiaryHTML(d);
  mon.textContent=monthStr(d.date)+' · '+(diaryIndex+1)+'/'+list.length;
  updateDiaryNav();
}
let flipLock=false;
function flip(dir){ // dir: +1 下一页, -1 上一页
  if(flipLock)return;
  const list=diaryMonthList();
  if(list.length===0)return;
  const target=diaryIndex+dir;
  if(target<0||target>=list.length)return;
  flipLock=true;
  const page=document.getElementById('diaryPage');
  page.style.transition='transform .3s ease-in';
  page.style.transform='rotateY('+(dir>0?-92:92)+'deg)'; // 当前页转向书脊
  setTimeout(()=>{
    diaryIndex=target;renderDiaryPage(); // 换内容
    page.style.transition='none';
    page.style.transform='rotateY('+(dir>0?92:-92)+'deg)'; // 从另一侧进入
    requestAnimationFrame(()=>{requestAnimationFrame(()=>{
      page.style.transition='transform .3s ease-out';
      page.style.transform='rotateY(0deg)';
    });});
    setTimeout(()=>{flipLock=false;},320);
  },300);
}
function diaryPrev(){flip(-1);}
function diaryNext(){flip(1);}
function updateDiaryNav(){
  const n=diaryMonthList().length;
  document.getElementById('diaryPrev').disabled=diaryIndex<=0;
  document.getElementById('diaryNext').disabled=diaryIndex>=n-1;
}
function addDiary(){
  const tx=document.getElementById('diaryText');
  const file=document.getElementById('diaryImg');
  const text=tx.value.trim();
  if(!text&&!file.files.length){return;}
  const entry={id:Date.now(),date:todayStr(),text};
  const done=()=>{
    state.diaries.push(entry);save();tx.value='';file.value='';
    const list=diaryMonthList();diaryIndex=Math.max(0,list.length-1); // 跳到最新一页
    renderDiaryPage();
  };
  if(file.files.length){
    const reader=new FileReader();
    reader.onload=()=>{entry.image=reader.result;done();};
    reader.readAsDataURL(file.files[0]);
  }else done();
}
// 触摸滑动翻页
(function(){
  const stage=document.getElementById('book');
  let sx=0,sy=0;
  stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  stage.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){
      if(dx<0)diaryNext();else diaryPrev();
    }
  },{passive:true});
})();

/* ---------- 顶部统计 ---------- */
function setRing(fgId,pctId,subId,pct,sub){
  const C=2*Math.PI*30;
  document.getElementById(fgId).style.strokeDasharray=C;
  document.getElementById(fgId).style.strokeDashoffset=C*(1-pct/100);
  document.getElementById(pctId).textContent=Math.round(pct)+'%';
  document.getElementById(subId).textContent=sub;
}
function updateStats(){
  // 本周打卡完成率
  let total=0,done=0;
  state.habits.forEach(h=>h.days.forEach(d=>{total++;if(d)done++;}));
  const wp=total?done/total*100:0;
  setRing('ringWeekFg','ringWeekPct','ringWeekSub',wp,`${done}/${total}`);
  // 本月任务完成率
  const mt=state.tasks.filter(t=>monthStr(t.date)===thisMonth());
  const mtDone=mt.filter(t=>t.done).length;
  const mp=mt.length?mtDone/mt.length*100:0;
  setRing('ringMonthFg','ringMonthPct','ringMonthSub',mp,`${mtDone}/${mt.length}`);
}

/* 初始化 */
renderHabits();
renderTasks();
renderDiaryPage();
updateStats();

/* 注册 Service Worker（支持离线 / 添加到手机屏幕） */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
