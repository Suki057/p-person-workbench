<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="YZfBsPQoFfBul8gx7FskCu">
<head data-page-node-id="wRk0fLh1cLCkckHUAleEXx">
<meta charset="UTF-8" data-page-node-id="04SfQuvYqhuTD7A2ylUirN">

<title>自律打卡</title>
<link rel="manifest" href="manifest.webmanifest" data-page-node-id="Ma6323kdk5lhdaVYUZWpcY">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<meta name="theme-color" content="#F26774" data-page-node-id="gbPP0yaRAgPuUqxWAy4d9L">
<style>
  :root{
    --bg:#FFF7F0;
    --pink:#FFD9DE;
    --green:#DCF3E0;
    --yellow:#FFF0C9;
    --pink-mid:#F26774;
    --green-mid:#54B463;
    --yellow-mid:#FFC83D;
    --blue:#5C9DF2;
    --text:#5a4a4a;
    --done:#a99b9b;
    --glass:rgba(255,255,255,0.55);
    --glass-strong:rgba(255,255,255,0.72);
    --glass-brd:rgba(255,255,255,0.75);
    --shadow:0 8px 28px rgba(150,90,100,0.14);
    --radius:18px;
    --cartoon:'ZCOOL KuaiLe','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Helvetica,"Microsoft YaHei",Arial,sans-serif;
    background:
      radial-gradient(circle at 12% 16%, rgba(255,138,149,.32), transparent 42%),
      radial-gradient(circle at 88% 12%, rgba(92,157,242,.30), transparent 44%),
      radial-gradient(circle at 82% 90%, rgba(255,200,61,.34), transparent 46%),
      radial-gradient(circle at 16% 94%, rgba(111,201,122,.30), transparent 46%),
      linear-gradient(140deg,#FFF6EC,#FDEFF5);
    background-attachment:fixed;
    color:var(--text);
    font-size:14px;
    line-height:1.5;
  }
  .app{max-width:560px;margin:0 auto;min-height:100vh;padding:14px 14px 110px;display:flex;flex-direction:column;}

  /* 顶部标题 · 玻璃浮卡 */
  .topbar{
    position:sticky;top:0;z-index:20;text-align:center;
    background:var(--glass);
    -webkit-backdrop-filter:blur(18px) saturate(180%);
    backdrop-filter:blur(18px) saturate(180%);
    border:1px solid var(--glass-brd);
    border-radius:var(--radius);
    padding:14px 16px;margin-bottom:16px;
    box-shadow:0 8px 26px rgba(150,90,100,0.14), inset 0 1px 0 rgba(255,255,255,0.85);
  }
  .topbar h1{font-family:var(--cartoon);font-size:23px;font-weight:400;letter-spacing:1px;color:var(--pink-mid);text-shadow:0 1px 0 #fff,0 2px 8px rgba(242,103,116,.25);}
  .topbar .sub{font-size:12px;color:var(--done);margin-top:5px;}

  /* 页面容器 */
  .pages{flex:1;}
  .page{display:none;animation:fade .3s ease;}
  .page.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .card{
    background:var(--glass);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    backdrop-filter:blur(20px) saturate(180%);
    border:1px solid var(--glass-brd);
    border-radius:var(--radius);
    box-shadow:0 10px 30px rgba(150,90,100,0.15), inset 0 1px 0 rgba(255,255,255,0.85);
    padding:16px;margin-bottom:14px;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:active{transform:translateY(-2px);box-shadow:0 14px 36px rgba(150,90,100,0.2), inset 0 1px 0 rgba(255,255,255,0.85);}
  .card h2{font-family:var(--cartoon);font-size:18px;font-weight:400;color:#5a4a4a;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
  .card h2 .hint{font-size:12px;color:var(--done);font-weight:400;font-family:-apple-system,"PingFang SC",sans-serif;}

  /* 通用按钮 / 输入 */
  .btn{border:none;border-radius:12px;padding:9px 16px;font-size:13px;cursor:pointer;background:var(--pink);color:#a23b46;font-family:var(--cartoon);letter-spacing:.5px;box-shadow:0 4px 12px rgba(242,103,116,.25);transition:transform .15s, opacity .2s;}
  .btn:active{opacity:.85;transform:scale(.96);}
  .btn.green{background:var(--green);color:#2f7a3e;box-shadow:0 4px 12px rgba(84,180,99,.25);}
  input[type=text],input:not([type]),textarea{
    border:1px solid rgba(255,255,255,0.9);border-radius:12px;padding:9px 12px;font-size:14px;background:var(--glass-strong);font-family:inherit;color:var(--text);box-shadow:inset 0 1px 3px rgba(150,90,100,.08);
  }
  input::placeholder,textarea::placeholder{color:#b6a8a8;}

  /* ---------- 打卡进度 tab ---------- */
  .progress-rings{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin:6px 0 4px;}
  .ring-lg{position:relative;width:112px;height:112px;filter:drop-shadow(0 6px 12px rgba(150,90,100,.18));}
  .ring-lg svg{transform:rotate(-90deg);}
  .ring-lg .ring-bg{fill:none;stroke:rgba(255,255,255,.7);stroke-width:9;}
  .ring-lg .ring-fg{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .6s ease;}
  #ringWeekFg{stroke:var(--pink-mid);}
  #ringMonthFg{stroke:var(--green-mid);}
  .ring-lg .ring-pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--cartoon);font-size:22px;font-weight:400;color:#5a4a4a;}
  .ring-lg .ring-pct small{font-family:-apple-system,"PingFang SC",sans-serif;font-size:11px;font-weight:400;color:var(--done);margin-top:3px;}
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;}
  .sum-item{background:var(--glass-strong);border:1px solid var(--glass-brd);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 6px 18px rgba(150,90,100,.12);}
  .sum-item:active{transform:scale(.96);}
  .sum-item:hover{box-shadow:0 10px 24px rgba(150,90,100,.18);}
  .sum-item .num{font-family:var(--cartoon);font-size:24px;font-weight:400;color:#5a4a4a;line-height:1.1;}
  .sum-item .lbl{font-size:12px;color:var(--done);margin-top:4px;}

  /* ---------- 周打卡 tab ---------- */
  .week-head{display:grid;grid-template-columns:64px repeat(7,1fr);gap:6px;margin-bottom:10px;}
  .week-head div{text-align:center;font-size:12px;color:var(--done);}
  .habit-row{position:relative;display:grid;grid-template-columns:92px repeat(7,1fr);gap:6px;align-items:center;margin-bottom:12px;}
  .habit-name{font-size:13px;display:flex;flex-direction:row;align-items:center;gap:8px;min-width:0;}
  .habit-name .nm-block{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
  .habit-name .nm{font-weight:600;color:#5a4a4a;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .habit-name .streak{font-size:10px;color:var(--done);}
  .habit-del{
    flex:0 0 auto;margin-left:2px;
    border:none;background:rgba(255,255,255,0.85);color:#a23b46;border-radius:50%;
    width:22px;height:22px;font-size:15px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;z-index:3;
    box-shadow:0 2px 6px rgba(150,90,100,.2);transition:background .2s,transform .15s,opacity .2s;opacity:0;
  }
  .habit-row:hover .habit-del,.habit-row.show-del .habit-del{opacity:1;}
  .habit-del:active{background:var(--pink-mid);color:#fff;transform:scale(.9);}
  .dot{
    width:32px;height:32px;border-radius:50%;margin:0 auto;cursor:pointer;
    background:var(--glass-strong);border:1.5px solid rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#fff;transition:transform .15s, background .2s, box-shadow .2s;user-select:none;
    box-shadow:0 3px 8px rgba(150,90,100,.12), inset 0 1px 2px rgba(255,255,255,.6);
  }
  .dot:active{transform:scale(.82);}
  .dot.done{background:var(--c);border-color:var(--c);box-shadow:0 4px 12px rgba(0,0,0,.18);}
  .dot.done::after{content:"✓";text-shadow:0 1px 1px rgba(0,0,0,.15);}
  .add-habit{margin-top:12px;display:flex;gap:8px;}
  .add-habit input{flex:1;}

  /* ---------- 每周任务 tab ---------- */
  .task-add{display:flex;gap:8px;margin-bottom:14px;}
  .task-add input{flex:1;}
  .task-date-group{margin-bottom:14px;}
  .task-date{font-size:12px;color:var(--pink-mid);margin:10px 0 6px;border-left:3px solid var(--green-mid);padding-left:8px;font-weight:600;}
  .task-item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px dashed rgba(150,90,100,.18);}
  .task-check{
    width:24px;height:24px;border-radius:50%;border:1.5px solid var(--green-mid);flex:0 0 auto;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#fff;transition:background .2s,transform .15s,box-shadow .2s;
    box-shadow:0 2px 6px rgba(150,90,100,.12);
  }
  .task-check:active{transform:scale(.82);}
  .task-check.done{background:var(--green-mid);border-color:var(--green-mid);box-shadow:0 3px 10px rgba(84,180,99,.3);}
  .task-check.done::after{content:"✓";}
  .task-text{flex:1;font-size:14px;transition:color .2s;}
  .task-text.done{color:var(--done);text-decoration:line-through;}
  .task-del{border:none;background:transparent;color:#c9bdbd;font-size:18px;cursor:pointer;padding:2px 6px;border-radius:8px;transition:background .2s,color .2s;}
  .task-del:active{color:#fff;background:var(--pink-mid);}

  /* ---------- 周计划手帐 tab（上下布局） ---------- */
  .week-strip{display:flex;gap:6px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--glass-brd);border-radius:var(--radius);box-shadow:0 8px 24px rgba(150,90,100,.14), inset 0 1px 0 rgba(255,255,255,.7);padding:10px 6px;margin-bottom:14px;}
  .ws-day{flex:1;text-align:center;padding:8px 0;border-radius:12px;cursor:pointer;transition:background .2s,transform .15s;position:relative;}
  .ws-day:active{transform:scale(.94);}
  .ws-day .d-num{font-family:var(--cartoon);font-size:18px;font-weight:400;color:#5a4a4a;line-height:1.1;}
  .ws-day .d-week{font-size:10px;color:var(--done);margin-top:2px;}
  .ws-day.today::after{content:"今";position:absolute;top:-2px;right:4px;font-size:9px;color:var(--green-mid);font-weight:700;}
  .ws-day.active{background:var(--pink-mid);box-shadow:0 4px 12px rgba(242,103,116,.35);}
  .ws-day.active .d-num,.ws-day.active .d-week{color:#fff;}
  .ws-day.active.today::after{color:#fff;}
  /* 日期格子里显示「有内容」标记（恢复摊开式左页概览的能力） */
  .ws-marks{display:flex;gap:3px;justify-content:center;margin-top:5px;min-height:9px;}
  .ws-dot{width:8px;height:8px;border-radius:50%;font-size:8px;line-height:8px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--cartoon);}
  .ws-dot.diary{background:var(--pink-mid);}
  .ws-dot.task{background:var(--green-mid);}
  .ws-day.active .ws-dot.diary{background:rgba(255,255,255,.95);color:var(--pink-mid);}
  .ws-day.active .ws-dot.task{background:rgba(255,255,255,.95);color:var(--green-mid);}

  .diary-paper{
    position:relative;min-height:300px;perspective:1500px;
    background:linear-gradient(135deg,#FFF3E6,#FBE8EF);
    border-radius:var(--radius);margin-bottom:14px;
    box-shadow:0 12px 34px rgba(150,90,100,.18), inset 0 1px 0 rgba(255,255,255,.7);
    border:1px solid var(--glass-brd);
    padding:10px;
  }
  .paper-spine{
    position:absolute;left:10px;top:10px;bottom:10px;width:14px;z-index:3;
    background:linear-gradient(90deg,#f2c9d2,#ffe3ea,#f2c9d2);
    border-radius:4px;box-shadow:0 0 8px rgba(242,103,116,.25);
  }
  .paper-inner{
    position:relative;margin-left:18px;min-height:280px;
    background:rgba(255,255,255,.78);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    border-radius:0 14px 14px 0;
    box-shadow:inset -8px 0 18px rgba(150,90,100,.06), 2px 4px 12px rgba(150,90,100,.1);
    padding:16px;transform-origin:left center;transform:rotateY(0deg);
    backface-visibility:hidden;overflow:hidden;
  }
  .paper-date{font-family:var(--cartoon);font-size:15px;color:#a23b46;font-weight:400;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .paper-date .week-no{font-size:11px;background:var(--pink);color:#a23b46;padding:2px 8px;border-radius:10px;font-family:-apple-system,"PingFang SC",sans-serif;}
  .paper-events{max-height:190px;overflow-y:auto;}
  .pr-event{
    background:var(--green-mid);color:#fff;border-radius:14px;
    padding:11px 14px;margin-bottom:8px;position:relative;
    box-shadow:0 4px 12px rgba(84,180,99,.32);cursor:pointer;transition:opacity .2s,transform .15s;
  }
  .pr-event:active{transform:scale(.98);}
  .pr-event.done{opacity:.6;background:#a9c9b0;}
  .pr-event .ev-text{font-size:14px;font-weight:500;}
  .pr-event .ev-text.done{text-decoration:line-through;}
  .pr-event .ev-tag{font-size:10px;opacity:.92;margin-top:5px;}
  .pr-event.diary{background:var(--pink-mid);box-shadow:0 4px 12px rgba(242,103,116,.32);}
  .pr-diary-img{width:100%;height:96px;object-fit:cover;border-radius:10px;margin-bottom:8px;}
  .pr-empty{color:var(--done);font-size:13px;text-align:center;padding:48px 0;}

  .diary-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .diary-nav .month{font-family:var(--cartoon);font-size:14px;color:var(--done);}
  .diary-nav button{border:none;background:var(--pink);color:#a23b46;border-radius:12px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:var(--cartoon);box-shadow:0 4px 12px rgba(242,103,116,.25);transition:opacity .2s,transform .15s;}
  .diary-nav button:active{opacity:.7;transform:scale(.96);}
  .diary-nav button:disabled{opacity:.4;box-shadow:none;}
  /* 保存日记：横向布局（文字 + 选取图片 + 保存 并排） */
  .diary-add{padding:14px;}
  .da-row{display:flex;gap:8px;align-items:flex-end;}
  .da-text{flex:1;min-width:0;min-height:64px;resize:vertical;line-height:1.55;border:1.5px solid rgba(255,255,255,.9);border-radius:12px;padding:10px 12px;font-size:14px;font-family:var(--cartoon);background:var(--glass-strong);color:#5a4a4a;}
  .da-text::placeholder{color:var(--done);}
  .da-file-btn{
    flex:0 0 auto;border:1.5px dashed var(--pink-mid);border-radius:12px;padding:10px 12px;
    font-size:13px;color:#a23b46;background:rgba(255,217,222,.35);cursor:pointer;
    display:flex;align-items:center;gap:4px;font-family:var(--cartoon);white-space:nowrap;transition:background .2s,transform .15s;
  }
  .da-file-btn:active{transform:scale(.96);background:rgba(255,217,222,.6);}
  .diary-add .btn{margin:0;flex:0 0 auto;}
  .da-files{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .da-files:empty{display:none;}
  .da-file-chip{
    display:flex;align-items:center;gap:8px;padding:8px 12px;
    background:rgba(255,217,222,.3);border:1px solid rgba(242,103,116,.25);border-radius:12px;
    font-size:12px;color:#a23b46;
  }
  .da-file-chip .fn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .da-file-x{border:none;background:var(--pink-mid);color:#fff;border-radius:50%;width:20px;height:20px;font-size:13px;line-height:1;cursor:pointer;flex:0 0 auto;transition:transform .15s;}
  .da-file-x:active{transform:scale(.85);}
  /* 日记查看弹窗 */
  .modal-mask{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(45,30,35,.45);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);}
  .modal-mask[hidden]{display:none;}
  .modal-card{width:100%;max-width:440px;max-height:84vh;overflow-y:auto;background:var(--glass-strong);border:1px solid rgba(255,255,255,.85);border-radius:24px;padding:18px;box-shadow:0 24px 60px rgba(0,0,0,.32);animation:pop .25s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96);}to{opacity:1;transform:none;}}
  .modal-back{border:none;background:var(--pink);color:#a23b46;border-radius:14px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:var(--cartoon);box-shadow:0 4px 12px rgba(242,103,116,.25);margin-bottom:14px;transition:transform .15s,opacity .2s;}
  .modal-back:active{transform:scale(.96);opacity:.8;}
  .modal-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
  .modal-imgs img{width:100%;height:90px;object-fit:cover;border-radius:12px;display:block;box-shadow:0 4px 10px rgba(0,0,0,.12);cursor:pointer;transition:transform .15s;}
  .modal-imgs img:active{transform:scale(.96);}
  .modal-imgs .modal-empty{grid-column:1/-1;}
  /* 图片放大查看 */
  .img-lightbox{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;background:rgba(20,12,16,.85);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:20px;}
  .img-lightbox[hidden]{display:none;}
  .img-lightbox img{max-width:100%;max-height:90vh;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.5);}
  .img-lightbox .lb-close{position:absolute;top:18px;right:18px;border:none;background:rgba(255,255,255,.92);color:#5a4a4a;border-radius:50%;width:40px;height:40px;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);}
  /* 删除确认弹窗 */
  .confirm-mask{position:fixed;inset:0;z-index:320;display:flex;align-items:center;justify-content:center;background:rgba(45,30,35,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:24px;}
  .confirm-mask[hidden]{display:none;}
  .confirm-card{width:100%;max-width:300px;background:var(--glass-strong);border:1px solid rgba(255,255,255,.85);border-radius:22px;padding:22px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:pop .22s ease;}
  .confirm-card .ctitle{font-family:var(--cartoon);font-size:16px;color:#5a4a4a;margin-bottom:6px;font-weight:600;}
  .confirm-card .cmsg{font-size:13px;color:var(--done);margin-bottom:18px;}
  .confirm-btns{display:flex;gap:10px;}
  .confirm-btns button{flex:1;border:none;border-radius:14px;padding:11px 0;font-size:14px;cursor:pointer;font-family:var(--cartoon);transition:transform .15s,opacity .2s;}
  .confirm-btns .c-cancel{background:rgba(255,255,255,.7);color:#7a6a6a;}
  .confirm-btns .c-ok{background:var(--pink-mid);color:#fff;box-shadow:0 4px 12px rgba(242,103,116,.3);}
  .confirm-btns button:active{transform:scale(.96);}
  .modal-text{font-size:15px;line-height:1.75;color:#5a4a4a;font-family:var(--cartoon);white-space:pre-wrap;word-break:break-word;}
  .modal-empty{color:var(--done);font-size:13px;text-align:center;padding:30px 0;}

  /* 手帐事件删除按钮 */
  .ev-del{
    position:absolute;top:6px;right:8px;border:none;background:rgba(255,255,255,0.8);
    color:#a23b46;border-radius:50%;width:24px;height:24px;font-size:14px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;
    box-shadow:0 2px 6px rgba(150,90,100,.2);transition:background .2s,transform .15s;
  }
  .ev-del:active{background:var(--pink-mid);color:#fff;transform:scale(.9);}

  /* 回收站 */
  .trash-item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px dashed rgba(150,90,100,.18);}

<script>
const PALETTE=[
  {key:'red',   light:'#FFD9DE', mid:'#F26774'},
  {key:'blue',  light:'#D8E8FB', mid:'#5C9DF2'},
  {key:'yellow',light:'#FFF0C9', mid:'#FFC83D'}
];
const DAYS=7;
const STORE_KEY='pperson_workbench_v1';

let state=loadState();

function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function monthStr(s){return s.slice(0,7);}
function thisMonth(){return monthStr(todayStr());}

function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem(STORE_KEY));
    if(s&&s.habits){
      if(!Array.isArray(s.trash))s.trash=[];
      if(!Array.isArray(s.tasks))s.tasks=[];
      if(!Array.isArray(s.diaries))s.diaries=[];
      return s;
    }
  }catch(e){}
  return {
    habits:[
      {id:1,name:'喝水',color:0,days:[false,false,false,false,false,false,false]},
      {id:2,name:'阅读',color:1,days:[false,false,false,false,false,false,false]},
      {id:3,name:'运动',color:2,days:[false,false,false,false,false,false,false]},
      {id:4,name:'早睡',color:0,days:[false,false,false,false,false,false,false]},
      {id:5,name:'冥想',color:1,days:[false,false,false,false,false,false,false]}
    ],
    tasks:[],
    diaries:[],
    trash:[]
  };
}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));}

/* ---------- 底部 tab 切换 ---------- */
function switchTab(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const page=document.getElementById('page-'+name);
  if(page)page.classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  if(name==='planner')renderPlanner();
  if(name==='trash')renderTrash();
  if(name==='progress')updateStats();
}

/* ---------- 周打卡 ---------- */
function maxStreak(days){
  let best=0,cur=0;
  for(const d of days){if(d){cur++;best=Math.max(best,cur);}else cur=0;}
  return best;
}
function renderHabits(){
  const wrap=document.getElementById('habitList');wrap.innerHTML='';
  state.habits.forEach(h=>{
    const p=PALETTE[h.color%3];
    const row=document.createElement('div');row.className='habit-row';
    const name=document.createElement('div');name.className='habit-name';
    name.innerHTML=`<div class="nm-block"><span class="nm">${escapeHtml(h.name)}</span><span class="streak">连续${maxStreak(h.days)}天</span></div>`;
    const del=document.createElement('button');del.className='habit-del';del.textContent='×';
    del.title='删除该习惯（可到回收站恢复）';
    del.onclick=(e)=>{e.stopPropagation();delHabit(h.id);};
    name.appendChild(del);
    row.appendChild(name);
    h.days.forEach((done,i)=>{
      const dot=document.createElement('div');
      dot.className='dot'+(done?' done':'');
      if(done) dot.style.setProperty('--c',p.mid);
      dot.onclick=()=>{h.days[i]=!h.days[i];save();renderHabits();updateStats();};
      row.appendChild(dot);
    });
    // 长按 450ms 显示删除按钮（移动端），松开即隐藏
    let lp=null;
    row.addEventListener('touchstart',()=>{lp=setTimeout(()=>row.classList.add('show-del'),450);},{passive:true});
    ['touchend','touchmove','touchcancel'].forEach(ev=>row.addEventListener(ev,()=>{if(lp){clearTimeout(lp);lp=null;}},{passive:true}));
    wrap.appendChild(row);
  });
}
function addHabit(){
  const inp=document.getElementById('habitInput');
  const v=inp.value.trim();if(!v)return;
  state.habits.push({id:Date.now(),name:v,color:state.habits.length%3,days:Array(DAYS).fill(false)});
  inp.value='';save();renderHabits();updateStats();
}
function delHabit(id){const h=state.habits.find(x=>x.id===id);if(h)moveToTrash('habit',h);}

/* ---------- 任务清单 ---------- */
function renderTasks(){
  const wrap=document.getElementById('taskList');wrap.innerHTML='';
  const groups={};
  state.tasks.forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t);});
  const dates=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  if(dates.length===0){wrap.innerHTML='<div class="pr-empty">还没有任务，添加一条开始吧～</div>';return;}
  dates.forEach(date=>{
    const g=document.createElement('div');g.className='task-date-group';
    const head=document.createElement('div');head.className='task-date';
    head.textContent=date===todayStr()?'今天 · '+date:date;
    g.appendChild(head);
    groups[date].forEach(t=>{
      const item=document.createElement('div');item.className='task-item';
      const chk=document.createElement('div');chk.className='task-check'+(t.done?' done':'');
      chk.onclick=()=>{t.done=!t.done;save();renderTasks();updateStats();};
      const txt=document.createElement('div');txt.className='task-text'+(t.done?' done':'');
      txt.textContent=t.text;
      const del=document.createElement('button');del.className='task-del';del.textContent='×';
      del.onclick=(e)=>confirmDelete(e,'task',t.id);
      item.append(chk,txt,del);g.appendChild(item);
    });
    wrap.appendChild(g);
  });
}
function addTask(){
  const inp=document.getElementById('taskInput');
  const v=inp.value.trim();if(!v)return;
  state.tasks.push({id:Date.now(),text:v,date:todayStr(),done:false});
  inp.value='';save();renderTasks();updateStats();
}
document.getElementById('taskInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});

/* ---------- 删除 / 回收站 ---------- */
function moveToTrash(type, item){
  if(type==='diary'){
    state.diaries=state.diaries.filter(d=>d.id!==item.id);
  }else if(type==='task'){
    state.tasks=state.tasks.filter(t=>t.id!==item.id);
  }else if(type==='habit'){
    state.habits=state.habits.filter(h=>h.id!==item.id);
  }
  state.trash.unshift({
    trashId:Date.now()+'_'+Math.random().toString(36).slice(2,7),
    type, item,
    deletedAt:new Date().toLocaleString('zh-CN',{hour12:false})
  });
  save();
  renderPlanner();renderTasks();renderHabits();updateStats();
  if(document.getElementById('page-trash').classList.contains('active'))renderTrash();
}
function delDiary(id){const d=state.diaries.find(x=>x.id===id);if(d)moveToTrash('diary',d);}
function delTaskFromPlanner(id){const t=state.tasks.find(x=>x.id===id);if(t)moveToTrash('task',t);}
function delTask(id){const t=state.tasks.find(x=>x.id===id);if(t)moveToTrash('task',t);}

function renderTrash(){
  const wrap=document.getElementById('trashList');if(!wrap)return;
  if(!state.trash.length){
    wrap.innerHTML='<div class="pr-empty">回收站是空的<br>误删的内容会暂时放在这里 🗑</div>';
    return;
  }
  wrap.innerHTML=state.trash.map(e=>{
    const isDiary=e.type==='diary';
    const isHabit=e.type==='habit';
    let label, text, date;
    if(isDiary){label='📖 手帐日记';text=e.item.text||'(无文字)';date=e.item.date||'';}
    else if(isHabit){label='✅ 周打卡习惯';text=e.item.name;date='连续'+maxStreak(e.item.days)+'天';}
    else {label='📝 任务';text=e.item.text;date=e.item.date||'';}
    return `<div class="trash-item">
      <div class="trash-info">
        <div class="trash-type">${label} · ${date}</div>
        <div class="trash-text">${escapeHtml(text)}</div>
        <div class="trash-date">${e.deletedAt} 删除</div>
      </div>
      <div class="trash-actions">
        <button class="restore" onclick="restoreFromTrash('${e.trashId}')">恢复</button>
        <button class="purge" onclick="purgeTrash('${e.trashId}')">永久删除</button>
      </div>
    </div>`;
  }).join('');
}
function restoreFromTrash(trashId){
  const idx=state.trash.findIndex(e=>e.trashId===trashId);
  if(idx<0)return;
  const e=state.trash[idx];
  if(e.type==='diary')state.diaries.push(e.item);
  else if(e.type==='habit')state.habits.push(e.item);
  else state.tasks.push(e.item);
  state.trash.splice(idx,1);
  save();renderTrash();renderPlanner();renderTasks();renderHabits();updateStats();
}
function purgeTrash(trashId){
  state.trash=state.trash.filter(e=>e.trashId!==trashId);
  save();renderTrash();
}
function emptyTrash(){
  if(!state.trash.length)return;
  if(!confirm('确定清空回收站？所有内容将永久删除，不可恢复。'))return;
  state.trash=[];save();renderTrash();
}

/* ---------- 周计划手帐（日期在上 + 日记在下） ---------- */
let selectedDate=todayStr();
const DAY_NAMES=['周日','周一','周二','周三','周四','周五','周六'];
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function formatDateObj(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getWeekDates(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const day=d.getDay();const offset=day===0?-6:1-day;
  const mon=new Date(d);mon.setDate(d.getDate()+offset);
  const dates=[];for(let i=0;i<7;i++){const dd=new Date(mon);dd.setDate(mon.getDate()+i);dates.push(formatDateObj(dd));}
  return dates;
}
function dayName(dateStr){return DAY_NAMES[new Date(dateStr+'T00:00:00').getDay()];}
function weekNumber(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const start=new Date(d.getFullYear(),0,1);
  const diff=d-start+((start.getDay()+6)%7)*86400000;
  return Math.floor(diff/604800000)+1;
}
function getDayEvents(dateStr){
  return{
    tasks:state.tasks.filter(t=>t.date===dateStr).sort((a,b)=>b.id-a.id),
    diaries:state.diaries.filter(d=>d.date===dateStr).sort((a,b)=>b.id-a.id)
  };
}
// 顶部周历条
function renderWeekStrip(){
  const strip=document.getElementById('weekStrip');if(!strip)return;
  const week=getWeekDates(selectedDate);
  strip.innerHTML=week.map(date=>{
    const isActive=date===selectedDate, isToday=date===todayStr();
    const nD=state.diaries.filter(d=>d.date===date).length;
    const nT=state.tasks.filter(t=>t.date===date).length;
    let marks='';
    if(nD>0||nT>0){
      marks='<div class="ws-marks">';
      if(nD>0)marks+=`<span class="ws-dot diary" title="${nD}篇日记">${nD>1?nD:''}</span>`;
      if(nT>0)marks+=`<span class="ws-dot task" title="${nT}项任务">${nT>1?nT:''}</span>`;
      marks+='</div>';
    }
    return `<div class="ws-day ${isActive?'active':''} ${isToday?'today':''}" onclick="selectDate('${date}')">
      <div class="d-num">${Number(date.slice(8))}</div>
      <div class="d-week">${dayName(date).replace('周','')}</div>
      ${marks}
    </div>`;
  }).join('');
}
// 中间日记纸（单页，可 3D 翻页）
function renderDiaryPaper(){
  const paper=document.getElementById('diaryPaper');if(!paper)return;
  const {tasks,diaries}=getDayEvents(selectedDate);
  let html=`<div class="paper-date">${Number(selectedDate.slice(5,7))}月${Number(selectedDate.slice(8))}日 ${dayName(selectedDate)} <span class="week-no">第${weekNumber(selectedDate)}周</span></div><div class="paper-events">`;
  if(!tasks.length&&!diaries.length){
    html+=`<div class="pr-empty">这一天还没有记录<br>在下方写点什么吧 🌿</div>`;
  }else{
    tasks.forEach(t=>{
      html+=`<div class="pr-event ${t.done?'done':''}" onclick="toggleTask(${t.id})">
        <button class="ev-del" onclick="confirmDelete(event,'task',${t.id})" title="删除">×</button>
        <div class="ev-text ${t.done?'done':''}">${escapeHtml(t.text)}</div>
        <div class="ev-tag">#${selectedDate.slice(0,7)} | 每天一件自律小事</div>
      </div>`;
    });
    diaries.forEach(d=>{
      const imgs=diaryImages(d);
      html+=`<div class="pr-event diary" onclick="openDiary(${d.id})">
        <button class="ev-del" onclick="confirmDelete(event,'diary',${d.id})" title="删除">×</button>
        ${imgs.map(s=>`<img class="pr-diary-img" src="${s}">`).join('')}
        <div class="ev-text">${escapeHtml(d.text||'')}</div>
        <div class="ev-tag">#${selectedDate.slice(0,7)} | 手帐日记</div>
      </div>`;
    });
  }
  html+='</div>';
  paper.innerHTML=html;
  const mon=document.getElementById('diaryMonth');
  if(mon)mon.textContent=selectedDate.slice(0,7)+' · '+dayName(selectedDate);
  updateDiaryNav();
}
function renderPlanner(){renderWeekStrip();renderDiaryPaper();}

let plannerFlipLock=false;
function flipTo(date, dir){
  if(plannerFlipLock||date===selectedDate)return;
  const paper=document.getElementById('diaryPaper');
  plannerFlipLock=true;
  paper.style.transition='transform .32s ease-in';
  paper.style.transform='rotateY('+(dir>0?-150:150)+'deg)'; // 当前页绕书脊翻折离开
  setTimeout(()=>{
    selectedDate=date;renderPlanner(); // 换内容
    paper.style.transition='none';
    paper.style.transform='rotateY('+(dir>0?150:-150)+'deg)'; // 从另一侧预备进入
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      paper.style.transition='transform .32s ease-out';
      paper.style.transform='rotateY(0deg)'; // 转回平整
    }));
    setTimeout(()=>{plannerFlipLock=false;},340);
  },320);
}
function selectDate(date){
  const dir=date>selectedDate?1:(date<selectedDate?-1:0);
  flipTo(date,dir);
}
function updateDiaryNav(){
  const week=getWeekDates(selectedDate);const idx=week.indexOf(selectedDate);
  document.getElementById('diaryPrev').disabled=idx<=0;
  document.getElementById('diaryNext').disabled=idx>=week.length-1;
}
function diaryPrev(){
  const week=getWeekDates(selectedDate);const idx=week.indexOf(selectedDate);
  if(idx>0){flipTo(week[idx-1],-1);}
}
function diaryNext(){
  const week=getWeekDates(selectedDate);const idx=week.indexOf(selectedDate);
  if(idx<week.length-1){flipTo(week[idx+1],1);}
}
function toggleTask(id){
  const t=state.tasks.find(x=>x.id===id);
  if(t){t.done=!t.done;save();renderPlanner();renderTasks();updateStats();}
}
function focusDiary(){document.getElementById('diaryText').focus();}
let selectedDiaryFiles=[];
function addDiary(){
  const tx=document.getElementById('diaryText');
  const text=tx.value.trim();
  if(!text && selectedDiaryFiles.length===0) return;
  const entry={id:Date.now(),date:selectedDate,text,images:[]};
  const files=selectedDiaryFiles.slice();
  const done=()=>{
    state.diaries.unshift(entry);save();   // 新日记置顶显示
    tx.value='';clearDiaryFile();          // 输入与图片恢复默认状态
    renderPlanner();renderTasks();updateStats();
  };
  if(files.length){
    let loaded=0;
    files.forEach(f=>{
      const reader=new FileReader();
      reader.onload=()=>{entry.images.push(reader.result);loaded++;if(loaded===files.length)done();};
      reader.readAsDataURL(f);
    });
  }else done();
}
// 选取图片后显示可删除的 chip（支持多张）
function showDiaryFileChip(){
  const file=document.getElementById('diaryImg');
  if(file.files&&file.files.length){
    for(let i=0;i<file.files.length;i++) selectedDiaryFiles.push(file.files[i]);
  }
  file.value='';
  renderDiaryFileChips();
}
function renderDiaryFileChips(){
  const box=document.getElementById('diaryFileChips');
  box.innerHTML=selectedDiaryFiles.map((f,i)=>`<div class="da-file-chip"><span class="fn">${escapeHtml(f.name)}</span><button type="button" class="da-file-x" onclick="removeDiaryFile(${i})">×</button></div>`).join('');
}
function removeDiaryFile(idx){selectedDiaryFiles.splice(idx,1);renderDiaryFileChips();}
function clearDiaryFile(){selectedDiaryFiles=[];const file=document.getElementById('diaryImg');if(file)file.value='';renderDiaryFileChips();}
// 绑定文件选择事件
document.getElementById('diaryImg').addEventListener('change',showDiaryFileChip);
// 日记查看弹窗
function diaryImages(d){return d.images&&d.images.length?d.images:(d.image?[d.image]:[]);}
let currentModalImgs=[];
function openDiary(id){
  const d=state.diaries.find(x=>x.id===id);if(!d)return;
  const imgs=diaryImages(d);
  currentModalImgs=imgs;
  document.getElementById('modalImgs').innerHTML=imgs.length
    ? imgs.map((s,i)=>`<img src="${s}" onclick="openImageLightbox(${i})" alt="日记图片 ${i+1}">`).join('')
    : '<div class="modal-empty">（无图片）</div>';
  document.getElementById('modalText').textContent=d.text||'（无文字）';
  document.getElementById('diaryModal').hidden=false;
}
function closeDiary(){document.getElementById('diaryModal').hidden=true;}
// 点击遮罩空白处关闭
document.getElementById('diaryModal').addEventListener('click',e=>{if(e.target.id==='diaryModal')closeDiary();});
// 图片放大查看（点击缩略图）
function openImageLightbox(idx){
  const src=currentModalImgs[idx];if(!src)return;
  document.getElementById('imgLightboxSrc').src=src;
  document.getElementById('imgLightbox').hidden=false;
}
function closeImageLightbox(){document.getElementById('imgLightbox').hidden=true;}
// 点击放大层空白处关闭
document.getElementById('imgLightbox').addEventListener('click',e=>{if(e.target.id==='imgLightbox')closeImageLightbox();});
// 删除确认（确定/取消）
let pendingDelete=null;
function confirmDelete(ev, type, id){
  if(ev&&ev.stopPropagation)ev.stopPropagation();
  pendingDelete={type,id};
  document.getElementById('confirmMsg').textContent = type==='diary'?'确定要删除这篇日记吗？':'确定要删除这条记录吗？';
  document.getElementById('confirmDialog').hidden=false;
}
function doConfirmDelete(){
  if(!pendingDelete)return;
  const {type,id}=pendingDelete;
  pendingDelete=null;
  document.getElementById('confirmDialog').hidden=true;
  if(type==='diary')delDiary(id);
  else delTaskFromPlanner(id);
}
function cancelConfirmDelete(){
  pendingDelete=null;
  document.getElementById('confirmDialog').hidden=true;
}
// 点击确认框空白处 = 取消
document.getElementById('confirmDialog').addEventListener('click',e=>{if(e.target.id==='confirmDialog')cancelConfirmDelete();});
// 触摸滑动翻页
(function(){
  const stage=document.getElementById('diaryPaper');
  if(!stage)return;
  let sx=0,sy=0;
  stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  stage.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){
      if(dx<0)diaryNext();else diaryPrev();
    }
  },{passive:true});
})();

/* ---------- 打卡进度统计 ---------- */
function setRing(fgId,pctId,pct){
  const C=2*Math.PI*46;
  const fg=document.getElementById(fgId);
  fg.style.strokeDasharray=C;
  fg.style.strokeDashoffset=C*(1-pct/100);
  document.getElementById(pctId).textContent=Math.round(pct)+'%';
}
function inThisWeek(dateStr){
  return getWeekDates(todayStr()).includes(dateStr);
}
function updateStats(){
  // 本周打卡完成率
  let total=0,done=0;
  state.habits.forEach(h=>h.days.forEach(d=>{total++;if(d)done++;}));
  const wp=total?done/total*100:0;
  setRing('ringWeekFg','ringWeekPct',wp);
  // 本月任务完成率
  const mt=state.tasks.filter(t=>monthStr(t.date)===thisMonth());
  const mtDone=mt.filter(t=>t.done).length;
  const mp=mt.length?mtDone/mt.length*100:0;
  setRing('ringMonthFg','ringMonthPct',mp);
  // 汇总卡片
  document.getElementById('sumStreak').textContent=state.habits.length?Math.max(...state.habits.map(h=>maxStreak(h.days))):0;
  document.getElementById('sumHabits').textContent=state.habits.length;
  const wt=state.tasks.filter(t=>inThisWeek(t.date));
  document.getElementById('sumTasks').textContent=wt.filter(t=>t.done).length+'/'+wt.length;
  document.getElementById('sumDiary').textContent=state.diaries.filter(d=>monthStr(d.date)===thisMonth()).length;
}

/* 初始化 */
renderHabits();
renderTasks();
renderPlanner();
updateStats();

/* 注册 Service Worker（支持离线 / 添加到手机屏幕） */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
