<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>自律打卡</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="自律打卡">
<meta name="theme-color" content="#E6B8C4">
<style>
  :root{
    --bg:#FAF8F5;
    --pink:#F8E0E6;
    --green:#E0F0E6;
    --yellow:#F8F0E0;
    --pink-mid:#E6B8C4;
    --green-mid:#ADD9BE;
    --yellow-mid:#E6D2A6;
    --text:#4a4a4a;
    --done:#999999;
    --shadow:rgba(0,0,0,0.05) 0px 2px 8px;
    --radius:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Helvetica,"Microsoft YaHei",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    line-height:1.5;
  }
  .app{max-width:540px;margin:0 auto;min-height:100vh;padding:14px 14px 88px;display:flex;flex-direction:column;}

  /* 顶部标题 */
  .topbar{text-align:center;padding:4px 0 14px;}
  .topbar h1{font-size:18px;font-weight:700;color:#5a5347;}
  .topbar .sub{font-size:12px;color:var(--done);margin-top:2px;}

  /* 页面容器 */
  .pages{flex:1;}
  .page{display:none;animation:fade .25s ease;}
  .page.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
  .card h2{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
  .card h2 .hint{font-size:12px;color:var(--done);font-weight:400;}

  /* 通用按钮 / 输入 */
  .btn{border:none;border-radius:6px;padding:8px 14px;font-size:13px;cursor:pointer;background:var(--pink);color:#7a5a63;transition:opacity .2s;}
  .btn:active{opacity:.7;}
  .btn.green{background:var(--green);color:#4f6f5a;}
  input[type=text],input:not([type]),textarea{
    border:1px solid #e3e0dc;border-radius:6px;padding:8px 10px;font-size:14px;background:var(--bg);font-family:inherit;
  }

  /* ---------- 打卡进度 tab ---------- */
  .progress-rings{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;}
  .ring-lg{position:relative;width:108px;height:108px;}
  .ring-lg svg{transform:rotate(-90deg);}
  .ring-lg .ring-bg{fill:none;stroke:#eee;stroke-width:9;}
  .ring-lg .ring-fg{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
  .ring-lg .ring-pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:#5a5347;}
  .ring-lg .ring-pct small{font-size:11px;font-weight:400;color:var(--done);margin-top:2px;}
  .summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .sum-item{background:var(--bg);border-radius:var(--radius);padding:14px 8px;text-align:center;}
  .sum-item .num{font-size:22px;font-weight:700;color:#5a5347;line-height:1.1;}
  .sum-item .lbl{font-size:12px;color:var(--done);margin-top:4px;}

  /* ---------- 周打卡 tab ---------- */
  .week-head{display:grid;grid-template-columns:64px repeat(7,1fr);gap:6px;margin-bottom:8px;}
  .week-head div{text-align:center;font-size:12px;color:var(--done);}
  .habit-row{display:grid;grid-template-columns:64px repeat(7,1fr);gap:6px;align-items:center;margin-bottom:10px;}
  .habit-name{font-size:13px;display:flex;flex-direction:column;gap:1px;}
  .habit-name .nm{font-weight:500;}
  .habit-name .streak{font-size:10px;color:var(--done);}
  .dot{
    width:30px;height:30px;border-radius:50%;margin:0 auto;cursor:pointer;
    background:#fff;border:1.5px solid #e3e0dc;display:flex;align-items:center;justify-content:center;
    font-size:15px;color:#fff;transition:transform .15s, background .2s;user-select:none;
  }
  .dot:active{transform:scale(.85);}
  .dot.done{background:var(--c);border-color:var(--c);}
  .dot.done::after{content:"✓";}
  .add-habit{margin-top:10px;display:flex;gap:6px;}
  .add-habit input{flex:1;}

  /* ---------- 每周任务 tab ---------- */
  .task-add{display:flex;gap:6px;margin-bottom:14px;}
  .task-add input{flex:1;}
  .task-date-group{margin-bottom:14px;}
  .task-date{font-size:12px;color:var(--done);margin:8px 0 6px;border-left:3px solid var(--green-mid);padding-left:8px;}
  .task-item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed #f0ede9;}
  .task-check{
    width:22px;height:22px;border-radius:50%;border:1.5px solid #d8d4cf;flex:0 0 auto;
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;background:#fff;transition:background .2s,transform .15s;
  }
  .task-check:active{transform:scale(.85);}
  .task-check.done{background:var(--green-mid);border-color:var(--green-mid);}
  .task-check.done::after{content:"✓";}
  .task-text{flex:1;font-size:14px;transition:color .2s;}
  .task-text.done{color:var(--done);text-decoration:line-through;}
  .task-del{border:none;background:transparent;color:#c9bdbd;font-size:16px;cursor:pointer;padding:2px 6px;}
  .task-del:active{color:#e08a8a;}

  /* ---------- 周计划手帐 tab（上下布局） ---------- */
  .week-strip{display:flex;gap:6px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 6px;margin-bottom:14px;}
  .ws-day{flex:1;text-align:center;padding:7px 0;border-radius:8px;cursor:pointer;transition:background .2s;position:relative;}
  .ws-day .d-num{font-size:16px;font-weight:700;color:#5a5347;line-height:1.1;}
  .ws-day .d-week{font-size:10px;color:var(--done);margin-top:2px;}
  .ws-day.today::after{content:"今";position:absolute;top:-3px;right:3px;font-size:9px;color:var(--green-mid);font-weight:700;}
  .ws-day.active{background:var(--pink-mid);}
  .ws-day.active .d-num,.ws-day.active .d-week{color:#fff;}
  .ws-day.active.today::after{color:#fff;}

  .diary-paper{
    position:relative;min-height:300px;perspective:1500px;
    background:linear-gradient(135deg,#F3E9DC,#EDE1CF);
    border-radius:var(--radius);margin-bottom:14px;
    box-shadow:inset 0 0 0 1px #e7dccb, var(--shadow);
    padding:10px;
  }
  .paper-spine{
    position:absolute;left:10px;top:10px;bottom:10px;width:14px;z-index:3;
    background:linear-gradient(90deg,#d9c7b0,#efe3d2,#d9c7b0);
    border-radius:3px;box-shadow:0 0 6px rgba(0,0,0,0.08);
  }
  .paper-inner{
    position:relative;margin-left:18px;min-height:280px;
    background:#FFFDF7;border-radius:0 8px 8px 0;
    box-shadow:inset -8px 0 18px rgba(0,0,0,0.04), 2px 0 6px rgba(0,0,0,0.04);
    padding:16px;transform-origin:left center;transform:rotateY(0deg);
    backface-visibility:hidden;overflow:hidden;
  }
  .paper-date{font-size:13px;color:#8a7a5a;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .paper-date .week-no{font-size:11px;background:var(--pink);color:#7a5a63;padding:1px 7px;border-radius:8px;}
  .paper-events{max-height:190px;overflow-y:auto;}
  .pr-event{
    background:var(--green-mid);color:#fff;border-radius:10px;
    padding:10px 12px;margin-bottom:8px;position:relative;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);cursor:pointer;transition:opacity .2s,transform .15s;
  }
  .pr-event:active{transform:scale(.98);}
  .pr-event.done{opacity:.55;background:#b8c9bf;}
  .pr-event .ev-text{font-size:14px;font-weight:500;}
  .pr-event .ev-text.done{text-decoration:line-through;}
  .pr-event .ev-tag{font-size:10px;opacity:.92;margin-top:5px;}
  .pr-event.diary{background:var(--pink-mid);}
  .pr-diary-img{width:100%;height:96px;object-fit:cover;border-radius:8px;margin-bottom:8px;}
  .pr-empty{color:var(--done);font-size:13px;text-align:center;padding:48px 0;}

  .diary-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .diary-nav .month{font-size:13px;color:var(--done);}
  .diary-nav button{border:none;background:var(--pink);color:#7a5a63;border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer;transition:opacity .2s;}
  .diary-nav button:active{opacity:.6;}
  .diary-nav button:disabled{opacity:.4;}
  .diary-add textarea{width:100%;min-height:64px;resize:vertical;margin-bottom:8px;}
  .diary-add .row{display:flex;gap:8px;align-items:center;}
  .diary-add input[type=file]{font-size:12px;flex:1;}

  /* 手帐事件删除按钮 */
  .ev-del{
    position:absolute;top:6px;right:8px;border:none;background:rgba(255,255,255,0.65);
    color:#7a5a63;border-radius:50%;width:22px;height:22px;font-size:14px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;
  }
  .ev-del:active{background:rgba(0,0,0,0.12);}

  /* 回收站 */
  .trash-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px dashed #f0ede9;}
  .trash-info{flex:1;min-width:0;}
  .trash-type{font-size:12px;color:var(--done);}
  .trash-text{font-size:14px;color:#5a5347;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
  .trash-date{font-size:11px;color:var(--done);margin-top:2px;}
  .trash-actions{display:flex;flex-direction:column;gap:6px;flex:0 0 auto;}
  .trash-actions button{border:none;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;transition:opacity .2s;}
  .trash-actions button:active{opacity:.7;}
  .trash-actions .restore{background:var(--green);color:#4f6f5a;}
  .trash-actions .purge{background:#fff;color:#c08a8a;border:1px solid #f0dada;}
  .trash-clear{width:100%;margin-top:12px;background:var(--yellow);color:#8a7a5a;}

  /* ---------- 底部 tab bar ---------- */
  .tabbar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:540px;display:flex;background:#fff;
    box-shadow:0 -2px 12px rgba(0,0,0,0.07);
    padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:50;
  }
  .tab{
    flex:1;border:none;background:transparent;cursor:pointer;
    padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;
    color:var(--done);font-size:11px;transition:color .2s;
  }
  .tab .ico{font-size:20px;line-height:1;}
  .tab.active{color:var(--pink-mid);}
  .tab:active{opacity:.7;}

  @media (max-width:560px){
    .app{padding:12px 12px 84px;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <h1>自律打卡</h1>
    <div class="sub">用一点秩序，爆改散漫的自己 🌿</div>
  </header>

  <main class="pages">
    <!-- 打卡进度 -->
    <section class="page active" id="page-progress">
      <div class="card">
        <div class="progress-rings">
          <div class="ring-lg">
            <svg width="108" height="108"><circle class="ring-bg" cx="54" cy="54" r="46"/><circle class="ring-fg" id="ringWeekFg" cx="54" cy="54" r="46" stroke="#E6B8C4"/></svg>
            <div class="ring-pct"><span id="ringWeekPct">0%</span><small>本周打卡</small></div>
          </div>
          <div class="ring-lg">
            <svg width="108" height="108"><circle class="ring-bg" cx="54" cy="54" r="46"/><circle class="ring-fg" id="ringMonthFg" cx="54" cy="54" r="46" stroke="#ADD9BE"/></svg>
            <div class="ring-pct"><span id="ringMonthPct">0%</span><small>本月任务</small></div>
          </div>
        </div>
        <div class="summary">
          <div class="sum-item"><div class="num" id="sumStreak">0</div><div class="lbl">最长连续打卡(天)</div></div>
          <div class="sum-item"><div class="num" id="sumHabits">0</div><div class="lbl">习惯数量</div></div>
          <div class="sum-item"><div class="num" id="sumTasks">0/0</div><div class="lbl">本月任务完成</div></div>
          <div class="sum-item"><div class="num" id="sumDiary">0</div><div class="lbl">本月日记(篇)</div></div>
        </div>
      </div>
    </section>

    <!-- 周打卡 -->
    <section class="page" id="page-weekcheck">
      <div class="card">
        <h2>周打卡 <span class="hint">点击圆点打卡</span></h2>
        <div class="week-head"><div></div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div>
        <div id="habitList"></div>
        <div class="add-habit">
          <input id="habitInput" placeholder="新增习惯，如：喝水">
          <button class="btn" onclick="addHabit()">添加</button>
        </div>
      </div>
    </section>

    <!-- 每周任务 -->
    <section class="page" id="page-tasks">
      <div class="card">
        <h2>每周任务 <span class="hint">勾选即完成</span></h2>
        <div class="task-add">
          <input id="taskInput" placeholder="输入新任务，回车添加">
          <button class="btn green" onclick="addTask()">添加</button>
        </div>
        <div id="taskList"></div>
      </div>
    </section>

    <!-- 周计划手帐 -->
    <section class="page" id="page-planner">
      <div class="week-strip" id="weekStrip"></div>
      <div class="diary-paper">
        <div class="paper-spine"></div>
        <div class="paper-inner" id="diaryPaper"></div>
      </div>
      <div class="diary-nav">
        <button id="diaryPrev" onclick="diaryPrev()">‹ 上一天</button>
        <span class="month" id="diaryMonth"></span>
        <button id="diaryNext" onclick="diaryNext()">下一天 ›</button>
      </div>
      <div class="card diary-add">
        <textarea id="diaryText" placeholder="记录今天的一点小事…"></textarea>
        <div class="row">
          <input type="file" id="diaryImg" accept="image/*">
          <button class="btn" onclick="addDiary()">保存日记</button>
        </div>
      </div>
    </section>

    <!-- 回收站 -->
    <section class="page" id="page-trash">
      <div class="card">
        <h2>回收站 <span class="hint">误删可恢复</span></h2>
        <div id="trashList"></div>
        <button class="btn trash-clear" onclick="emptyTrash()">清空回收站</button>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="progress" onclick="switchTab('progress')"><span class="ico">📊</span>打卡进度</button>
    <button class="tab" data-tab="weekcheck" onclick="switchTab('weekcheck')"><span class="ico">✅</span>周打卡</button>
    <button class="tab" data-tab="tasks" onclick="switchTab('tasks')"><span class="ico">📝</span>每周任务</button>
    <button class="tab" data-tab="planner" onclick="switchTab('planner')"><span class="ico">📖</span>周计划手帐</button>
    <button class="tab" data-tab="trash" onclick="switchTab('trash')"><span class="ico">🗑</span>回收站</button>
  </nav>
</div>

<script>
const PALETTE=[
  {key:'pink',  light:'#F8E0E6', mid:'#E6B8C4'},
  {key:'green', light:'#E0F0E6', mid:'#ADD9BE'},
  {key:'yellow',light:'#F8F0E0', mid:'#E6D2A6'}
];
const DAYS=7;
const STORE_KEY='pperson_workbench_v1';

let state=loadState();

function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function monthStr(s){return s.slice(0,7);}
function thisMonth(){return monthStr(todayStr());}

function loadState(){
  try{
    const s=JSON.parse(localStorage.getItem(STORE_KEY));
    if(s&&s.habits){
      if(!Array.isArray(s.trash))s.trash=[];
      if(!Array.isArray(s.tasks))s.tasks=[];
      if(!Array.isArray(s.diaries))s.diaries=[];
      return s;
    }
  }catch(e){}
  return {
    habits:[
      {id:1,name:'喝水',color:0,days:[false,false,false,false,false,false,false]},
      {id:2,name:'阅读',color:1,days:[false,false,false,false,false,false,false]},
      {id:3,name:'运动',color:2,days:[false,false,false,false,false,false,false]},
      {id:4,name:'早睡',color:0,days:[false,false,false,false,false,false,false]},
      {id:5,name:'冥想',color:1,days:[false,false,false,false,false,false,false]}
    ],
    tasks:[],
    diaries:[],
    trash:[]
  };
}
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state));}

/* ---------- 底部 tab 切换 ---------- */
function switchTab(name){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const page=document.getElementById('page-'+name);
  if(page)page.classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===name));
  if(name==='planner')renderPlanner();
  if(name==='trash')renderTrash();
}

/* ---------- 周打卡 ---------- */
function maxStreak(days){
  let best=0,cur=0;
  for(const d of days){if(d){cur++;best=Math.max(best,cur);}else cur=0;}
  return best;
}
function renderHabits(){
  const wrap=document.getElementById('habitList');wrap.innerHTML='';
  state.habits.forEach(h=>{
    const p=PALETTE[h.color%3];
    const row=document.createElement('div');row.className='habit-row';
    const name=document.createElement('div');name.className='habit-name';
    name.innerHTML=`<span class="nm">${h.name}</span><span class="streak">连续${maxStreak(h.days)}天</span>`;
    row.appendChild(name);
    h.days.forEach((done,i)=>{
      const dot=document.createElement('div');
      dot.className='dot'+(done?' done':'');
      if(done) dot.style.setProperty('--c',p.mid);
      dot.onclick=()=>{h.days[i]=!h.days[i];save();renderHabits();updateStats();};
      row.appendChild(dot);
    });
    wrap.appendChild(row);
  });
}
function addHabit(){
  const inp=document.getElementById('habitInput');
  const v=inp.value.trim();if(!v)return;
  state.habits.push({id:Date.now(),name:v,color:state.habits.length%3,days:Array(DAYS).fill(false)});
  inp.value='';save();renderHabits();updateStats();
}

/* ---------- 任务清单 ---------- */
function renderTasks(){
  const wrap=document.getElementById('taskList');wrap.innerHTML='';
  const groups={};
  state.tasks.forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t);});
  const dates=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
  if(dates.length===0){wrap.innerHTML='<div class="pr-empty">还没有任务，添加一条开始吧～</div>';return;}
  dates.forEach(date=>{
    const g=document.createElement('div');g.className='task-date-group';
    const head=document.createElement('div');head.className='task-date';
    head.textContent=date===todayStr()?'今天 · '+date:date;
    g.appendChild(head);
    groups[date].forEach(t=>{
      const item=document.createElement('div');item.className='task-item';
      const chk=document.createElement('div');chk.className='task-check'+(t.done?' done':'');
      chk.onclick=()=>{t.done=!t.done;save();renderTasks();updateStats();};
      const txt=document.createElement('div');txt.className='task-text'+(t.done?' done':'');
      txt.textContent=t.text;
      const del=document.createElement('button');del.className='task-del';del.textContent='×';
      del.onclick=()=>delTask(t.id);
      item.append(chk,txt,del);g.appendChild(item);
    });
    wrap.appendChild(g);
  });
}
function addTask(){
  const inp=document.getElementById('taskInput');
  const v=inp.value.trim();if(!v)return;
  state.tasks.push({id:Date.now(),text:v,date:todayStr(),done:false});
  inp.value='';save();renderTasks();updateStats();
}
document.getElementById('taskInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});

/* ---------- 删除 / 回收站 ---------- */
function moveToTrash(type, item){
  if(type==='diary'){
    state.diaries=state.diaries.filter(d=>d.id!==item.id);
  }else if(type==='task'){
    state.tasks=state.tasks.filter(t=>t.id!==item.id);
  }
  state.trash.unshift({
    trashId:Date.now()+'_'+Math.random().toString(36).slice(2,7),
    type, item,
    deletedAt:new Date().toLocaleString('zh-CN',{hour12:false})
  });
  save();
  renderPlanner();renderTasks();updateStats();
  if(document.getElementById('page-trash').classList.contains('active'))renderTrash();
}
function delDiary(id){const d=state.diaries.find(x=>x.id===id);if(d)moveToTrash('diary',d);}
function delTaskFromPlanner(id){const t=state.tasks.find(x=>x.id===id);if(t)moveToTrash('task',t);}
function delTask(id){const t=state.tasks.find(x=>x.id===id);if(t)moveToTrash('task',t);}

function renderTrash(){
  const wrap=document.getElementById('trashList');if(!wrap)return;
  if(!state.trash.length){
    wrap.innerHTML='<div class="pr-empty">回收站是空的<br>误删的内容会暂时放在这里 🗑</div>';
    return;
  }
  wrap.innerHTML=state.trash.map(e=>{
    const isDiary=e.type==='diary';
    const label=isDiary?'📖 手帐日记':'📝 任务';
    const text=isDiary?(e.item.text||'(无文字)'):e.item.text;
    const date=e.item.date||'';
    return `<div class="trash-item">
      <div class="trash-info">
        <div class="trash-type">${label} · ${date}</div>
        <div class="trash-text">${escapeHtml(text)}</div>
        <div class="trash-date">${e.deletedAt} 删除</div>
      </div>
      <div class="trash-actions">
        <button class="restore" onclick="restoreFromTrash('${e.trashId}')">恢复</button>
        <button class="purge" onclick="purgeTrash('${e.trashId}')">永久删除</button>
      </div>
    </div>`;
  }).join('');
}
function restoreFromTrash(trashId){
  const idx=state.trash.findIndex(e=>e.trashId===trashId);
  if(idx<0)return;
  const e=state.trash[idx];
  if(e.type==='diary')state.diaries.push(e.item);
  else state.tasks.push(e.item);
  state.trash.splice(idx,1);
  save();renderTrash();renderPlanner();renderTasks();updateStats();
}
function purgeTrash(trashId){
  state.trash=state.trash.filter(e=>e.trashId!==trashId);
  save();renderTrash();
}
function emptyTrash(){
  if(!state.trash.length)return;
  if(!confirm('确定清空回收站？所有内容将永久删除，不可恢复。'))return;
  state.trash=[];save();renderTrash();
}

/* ---------- 周计划手帐（日期在上 + 日记在下） ---------- */
let selectedDate=todayStr();
const DAY_NAMES=['周日','周一','周二','周三','周四','周五','周六'];
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function formatDateObj(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getWeekDates(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const day=d.getDay();const offset=day===0?-6:1-day;
  const mon=new Date(d);mon.setDate(d.getDate()+offset);
  const dates=[];for(let i=0;i<7;i++){const dd=new Date(mon);dd.setDate(mon.getDate()+i);dates.push(formatDateObj(dd));}
  return dates;
}
function dayName(dateStr){return DAY_NAMES[new Date(dateStr+'T00:00:00').getDay()];}
function weekNumber(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const start=new Date(d.getFullYear(),0,1);
  const diff=d-start+((start.getDay()+6)%7)*86400000;
  return Math.floor(diff/604800000)+1;
}
function getDayEvents(dateStr){
  return{
    tasks:state.tasks.filter(t=>t.date===dateStr).sort((a,b)=>b.id-a.id),
    diaries:state.diaries.filter(d=>d.date===dateStr).sort((a,b)=>b.id-a.id)
  };
}
// 顶部周历条
function renderWeekStrip(){
  const strip=document.getElementById('weekStrip');if(!strip)return;
  const week=getWeekDates(selectedDate);
  strip.innerHTML=week.map(date=>{
    const isActive=date===selectedDate, isToday=date===todayStr();
    return `<div class="ws-day ${isActive?'active':''} ${isToday?'today':''}" onclick="selectDate('${date}')">
      <div class="d-num">${Number(date.slice(8))}</div>
      <div class="d-week">${dayName(date).replace('周','')}</div>
    </div>`;
  }).join('');
}
// 中间日记纸（单页，可 3D 翻页）
function renderDiaryPaper(){
  const paper=document.getElementById('diaryPaper');if(!paper)return;
  const {tasks,diaries}=getDayEvents(selectedDate);
  let html=`<div class="paper-date">${Number(selectedDate.slice(5,7))}月${Number(selectedDate.slice(8))}日 ${dayName(selectedDate)} <span class="week-no">第${weekNumber(selectedDate)}周</span></div><div class="paper-events">`;
  if(!tasks.length&&!diaries.length){
    html+=`<div class="pr-empty">这一天还没有记录<br>在下方写点什么吧 🌿</div>`;
  }else{
    tasks.forEach(t=>{
      html+=`<div class="pr-event ${t.done?'done':''}" onclick="toggleTask(${t.id})">
        <button class="ev-del" onclick="event.stopPropagation();delTaskFromPlanner(${t.id})" title="删除">×</button>
        <div class="ev-text ${t.done?'done':''}">${escapeHtml(t.text)}</div>
        <div class="ev-tag">#${selectedDate.slice(0,7)} | 每天一件自律小事</div>
      </div>`;
    });
    diaries.forEach(d=>{
      html+=`<div class="pr-event diary">
        <button class="ev-del" onclick="event.stopPropagation();delDiary(${d.id})" title="删除">×</button>
        ${d.image?`<img class="pr-diary-img" src="${d.image}">`:''}
        <div class="ev-text">${escapeHtml(d.text||'')}</div>
        <div class="ev-tag">#${selectedDate.slice(0,7)} | 手帐日记</div>
      </div>`;
    });
  }
  html+='</div>';
  paper.innerHTML=html;
  const mon=document.getElementById('diaryMonth');
  if(mon)mon.textContent=selectedDate.slice(0,7)+' · '+dayName(selectedDate);
  updateDiaryNav();
}
function renderPlanner(){renderWeekStrip();renderDiaryPaper();}

let plannerFlipLock=false;
function flipTo(date, dir){
  if(plannerFlipLock||date===selectedDate)return;
  const paper=document.getElementById('diaryPaper');
  plannerFlipLock=true;
  paper.style.transition='transform .32s ease-in';
  paper.style.transform='rotateY('+(dir>0?-150:150)+'deg)'; // 当前页绕书脊翻折离开
  setTimeout(()=>{
    selectedDate=date;renderPlanner(); // 换内容
    paper.style.transition='none';
    paper.style.transform='rotateY('+(dir>0?150:-150)+'deg)'; // 从另一侧预备进入
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      paper.style.transition='transform .32s ease-out';
      paper.style.transform='rotateY(0deg)'; // 转回平整
    }));
    setTimeout(()=>{plannerFlipLock=false;},340);
  },320);
}
function selectDate(date){
  const dir=date>selectedDate?1:(date<selectedDate?-1:0);
  flipTo(date,dir);
}
function updateDiaryNav(){
  const week=getWeekDates(selectedDate);const idx=week.indexOf(selectedDate);
  document.getElementById('diaryPrev').disabled=idx<=0;
  document.getElementById('diaryNext').disabled=idx>=week.length-1;
}
function diaryPrev(){
  const week=getWeekDates(selectedDate);const idx=week.indexOf(selectedDate);
  if(idx>0){flipTo(week[idx-1],-1);}
}
function diaryNext(){
  const week=getWeekDates(selectedDate);const idx=week.indexOf(selectedDate);
  if(idx<week.length-1){flipTo(week[idx+1],1);}
}
function toggleTask(id){
  const t=state.tasks.find(x=>x.id===id);
  if(t){t.done=!t.done;save();renderPlanner();renderTasks();updateStats();}
}
function focusDiary(){document.getElementById('diaryText').focus();}
function addDiary(){
  const tx=document.getElementById('diaryText');
  const file=document.getElementById('diaryImg');
  const text=tx.value.trim();
  if(!text&&!file.files.length){return;}
  const entry={id:Date.now(),date:selectedDate,text};
  const done=()=>{
    state.diaries.push(entry);save();tx.value='';file.value='';
    renderPlanner();renderTasks();updateStats();
  };
  if(file.files.length){
    const reader=new FileReader();
    reader.onload=()=>{entry.image=reader.result;done();};
    reader.readAsDataURL(file.files[0]);
  }else done();
}
// 触摸滑动翻页
(function(){
  const stage=document.getElementById('diaryPaper');
  if(!stage)return;
  let sx=0,sy=0;
  stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
  stage.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){
      if(dx<0)diaryNext();else diaryPrev();
    }
  },{passive:true});
})();

/* ---------- 打卡进度统计 ---------- */
function setRing(fgId,pctId,pct){
  const C=2*Math.PI*46;
  const fg=document.getElementById(fgId);
  fg.style.strokeDasharray=C;
  fg.style.strokeDashoffset=C*(1-pct/100);
  document.getElementById(pctId).textContent=Math.round(pct)+'%';
}
function inThisWeek(dateStr){
  return getWeekDates(todayStr()).includes(dateStr);
}
function updateStats(){
  // 本周打卡完成率
  let total=0,done=0;
  state.habits.forEach(h=>h.days.forEach(d=>{total++;if(d)done++;}));
  const wp=total?done/total*100:0;
  setRing('ringWeekFg','ringWeekPct',wp);
  // 本月任务完成率
  const mt=state.tasks.filter(t=>monthStr(t.date)===thisMonth());
  const mtDone=mt.filter(t=>t.done).length;
  const mp=mt.length?mtDone/mt.length*100:0;
  setRing('ringMonthFg','ringMonthPct',mp);
  // 汇总卡片
  document.getElementById('sumStreak').textContent=state.habits.length?Math.max(...state.habits.map(h=>maxStreak(h.days))):0;
  document.getElementById('sumHabits').textContent=state.habits.length;
  const wt=state.tasks.filter(t=>inThisWeek(t.date));
  document.getElementById('sumTasks').textContent=wt.filter(t=>t.done).length+'/'+wt.length;
  document.getElementById('sumDiary').textContent=state.diaries.filter(d=>monthStr(d.date)===thisMonth()).length;
}

/* 初始化 */
renderHabits();
renderTasks();
renderPlanner();
updateStats();

/* 注册 Service Worker（支持离线 / 添加到手机屏幕） */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
</script>
